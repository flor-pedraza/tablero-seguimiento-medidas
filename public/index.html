<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Seguimiento de Medidas</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1>Seguimiento de Medidas</h1>
      <p>Área de Seguimiento de Medidas de Protección a Víctimas y Testigos</p>
    </div>
    <div class="meta">
      <span id="updated">Cargando datos…</span>
      <button id="reload" class="ghost" title="Volver a leer la planilla">Actualizar</button>
    </div>
  </header>

  <nav class="tabs" id="tabs" role="tablist"></nav>

  <main id="app">
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>Leyendo la planilla…</p>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
